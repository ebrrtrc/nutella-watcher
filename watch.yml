name: Nutella Hediye Takip

on:
  schedule:
    # Her 5 dakikada bir çalışır (UTC). GitHub Actions'ta minimum aralık ~5 dk'dır,
    # yoğun saatlerde birkaç dakika gecikebilir.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: nutella-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scripti çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Durumu kaydet (commit)
        run: |
          git config user.name "nutella-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state güncellendi"
          git push
